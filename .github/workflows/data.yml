# Rebuilds the stats BetTracker reads (pipeline/build.py) from nflverse's daily
# releases and publishes them to the `data` branch, served from
# https://raw.githubusercontent.com/hbirk01/NFL-stats/data/<file>.json
name: Publish data

on:
  schedule:
    # nflverse refreshes overnight; again Monday/Tuesday mornings after the weekend's games.
    - cron: "30 11 * * *"
    - cron: "30 15 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the NBA publish: both rewrite the one-commit data branch.
  group: publish-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # For MODEL_USER_ID, which model.json carries so the app can find the Model's picks.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/build.py --out dist
        env:
          MODEL_USER_ID: ${{ secrets.MODEL_USER_ID }}
      - name: Keep the NBA files (Publish NBA data builds those)
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" prev && cp -r prev/nba dist/nba || true
          rm -rf prev
      - name: Publish to the data branch
        run: |
          cd dist
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          # One commit, replaced each run: the branch only ever holds the latest data.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
